<!doctype html>
<!-- Drawn card thumbnails (800×420) for projects with no public screen to capture.
     Render: file://…/og/thumbs.html#watch and #itiles (see README). -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:800px;height:420px;overflow:hidden}
body{font-family:system-ui,sans-serif}
.s{position:absolute;inset:0;display:none}
:target{display:block}
/* Stakco Watch: the watch-face prototype, bezel turns the rings */
#watch{background:radial-gradient(90% 120% at 30% 20%,#3b2a63,#1b1430 70%)}
#watch .face{position:absolute;left:412px;top:218px;width:600px;height:600px;transform:translate(-50%,-50%) scale(.56);clip-path:circle(247px at 279px 286px);filter:drop-shadow(0 30px 40px #000)}
#watch svg{position:absolute;inset:0}
/* Stakco iTiles: a 3×3 floor of tiles beside the puzzle they turn */
#itiles{background:#3a2d38}
#itiles .floor{position:absolute;left:70px;top:70px;width:300px;height:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;transform:perspective(700px) rotateX(48deg) rotateZ(-30deg);transform-origin:50% 60%}
#itiles .floor i{border-radius:14px;background:#5a4a57;box-shadow:inset 0 -6px 0 #00000040}
#itiles .floor i.a{background:#ffb347;box-shadow:0 0 34px #ffb347aa,inset 0 -6px 0 #00000030}
#itiles .floor i.b{background:#ff5d73;box-shadow:0 0 30px #ff5d7399,inset 0 -6px 0 #00000030}
#itiles .floor i.c{background:#8b6cff;box-shadow:0 0 30px #8b6cff99,inset 0 -6px 0 #00000030}
#itiles .disc{position:absolute;left:600px;top:210px;width:320px;height:320px;transform:translate(-50%,-50%);border-radius:50%;background:url(../public/thumbs/stakco-play.jpg) -240px -50px/800px 420px;box-shadow:0 24px 50px -10px #000}
#itiles svg{position:absolute;inset:0}
</style></head><body>
<div class="s" id="watch">
  <img class="face" src="img/watch-face.png" alt="">
  <svg viewBox="0 0 800 420" fill="none" stroke="#ffc93c" stroke-width="7" stroke-linecap="round">
    <path d="M273 92A178 178 0 0 1 527 92"/><path d="M515 70l14 22-25 6" stroke-linejoin="round"/>
    <path d="M527 328A178 178 0 0 1 273 328"/><path d="M285 350l-14-22 25-6" stroke-linejoin="round"/>
  </svg>
</div>
<div class="s" id="itiles">
  <div class="floor"><i></i><i class="b"></i><i></i><i></i><i class="a"></i><i></i><i class="c"></i><i></i><i></i></div>
  <div class="disc"></div>
  <svg viewBox="0 0 800 420" fill="none" stroke="#ffb347" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 30A180 180 0 0 1 772 160"/><path d="M754 150l18 12 6-22"/>
  </svg>
</div>
</body></html>
