<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#1e1530;color:#f2eefa;font-family:"DM Sans",sans-serif;display:grid;grid-template-columns:480px 1fr;gap:40px;padding:56px 0 56px 64px;box-sizing:border-box;
  background-image:radial-gradient(70% 90% at 0% 0%,#3b2a63,transparent 70%)}
.l{display:flex;flex-direction:column}
.dom{font-family:"JetBrains Mono",monospace;font-size:19px;color:#b4a9cc;display:flex;align-items:center;gap:14px}
.chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;color:#1e1530;background:#ffc93c;border-radius:999px;padding:6px 18px 8px;box-shadow:inset 0 -4px 0 #00000026}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:160px;line-height:.9;margin:34px 0 0;letter-spacing:-.05em}
h1 i{font-style:normal;color:#a487ff}
.sub{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:38px;color:#dcd5ec;margin-top:12px;line-height:1.15}
.tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px}
.tags span{font-size:20px;padding:7px 16px;border-radius:999px;background:#ffffff14;color:#ece8f6}
.r{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;padding-right:56px}
.r figure{margin:0;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px -18px #000;background:#0a0712}
.r img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
</style></head><body>
<div class="l">
  <div class="dom"><span class="chip">Play</span>play.sankhacooray.com</div>
  <h1>play<i>.</i></h1>
  <div class="sub">Games, puzzles &amp; playful interaction</div>
  <div class="tags"><span>Ring puzzles</span><span>Floor-tile games</span><span>AR darts</span><span>Location games</span></div>
</div>
<div class="r">
  <figure><img src="../public/thumbs/stakco-play.jpg"></figure>
  <figure><img src="../public/thumbs/itiles-games.jpg" style="object-position:left top"></figure>
  <figure><img src="../public/thumbs/dartsar.jpg" style="object-position:20% 70%"></figure>
  <figure><img src="img/geodex.jpg" style="object-position:left center"></figure>
</div>
</body></html>
